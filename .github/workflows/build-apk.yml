name: Build APK

on:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build flipper-lab-a53.apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Install npm dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: bash -lc "cd android && ./gradlew assembleDebug --no-daemon"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flipper-lab-a53-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch'
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: flipper-lab-a53.apk
          body: |
            Flipper Lab A53 APK (debug build).
            - Web build from the current commit.
            - Signed with the debug key — installable via `adb install -r`.
            - For release signing, add a `release-keystore.jks` and signing config in `android/app/build.gradle`.
          draft: false
          prerelease: true
