name: Build APK

on:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apk:
    name: Build flipper-lab-a53.apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK command-line tools
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            curl -fsSL -o /tmp/cmdtools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install npm dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Add & sync Capacitor Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Install Gradle wrapper jar
        run: |
          cd android
          mkdir -p gradle/wrapper
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      - name: Build debug APK
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
        run: |
          cd android
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee /tmp/build.log
          exit "${PIPESTATUS[0]}"

      - name: Inspect APK
        run: |
          ls -la android/app/build/outputs/apk/debug/
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | head -20

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flipper-lab-a53-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Commit APK into dist/ on this branch (directly fetchable from GitHub)
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/flipper-lab-a53.apk
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f dist/flipper-lab-a53.apk
          git commit -m "ci: release APK build ${GITHUB_SHA:0:7} [skip ci]" || true
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}" || true

      - name: Publish GitHub Release with APK asset (direct download link)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=dist/flipper-lab-a53.apk
          NOTES="Flipper Zero + ESP32 pentest lab for Samsung Galaxy A53 5G. Direct APK download: https://github.com/${{ github.repository }}/releases/download/v1.0.0/flipper-lab-a53.apk"
          gh release view v1.0.0 >/dev/null 2>&1 || \
            gh release create v1.0.0 --target "$GITHUB_SHA" --title "Flipper Lab A53 v1.0.0" --notes "$NOTES"
          ok=0
          for i in 1 2 3; do
            if gh release upload v1.0.0 "$APK" --clobber; then ok=1; break; fi
            echo "upload attempt $i failed"
            sleep 5
          done
          [ "$ok" = "1" ] || echo "WARN: release asset upload failed"
          gh release view v1.0.0 --json assets --jq '.assets[].browser_download_url' || true
